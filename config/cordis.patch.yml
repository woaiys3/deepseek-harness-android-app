# dsh-android-patch: v3
# Android 兼容性 patch
# 已修复：subprocess-local（node-pty → child_process；koffi 惰性加载）、
#        attachment-local（sharp → 纯 JS 头解析 sharp-shim.js）、
#        bash-local（sandboxMode 覆盖）、session-persistence-jsonl（link → rename）
# 只禁用 bash-sandbox（用 bash-local 替代它提供 ctx.shell）。
#
# ⚠ v1.15 修正：sandbox（@deepseek-ai/dsh-sandbox-local）**必须保持启用**。
#   0.1.7 起 ptc-runtime（@deepseek-ai/dsh-ptc-runtime-node）inject 了 sandbox 服务，
#   而 agent preset（standard / ptc / cordis 三套）都挂 workflow-ptc + tool-workflow：
#   sandbox 一禁用 → ptc-runtime 永久 pending → workflow-ptc 拿不到 ptcRuntime →
#   workflowEngine 缺失 → **所有 preset 会话 create/resume 直接失败**，报
#   “workflow-ptc: waiting for ptcRuntime / tool-workflow: waiting for workflowEngine”。
#   旧版本担心它“要 koffi”——实测不成立：sandbox-local 只通过 @deepseek-ai/node-addon-system
#   的 landlock-run 解析平台包（缺失时 probe=unusable），全程惰性、加载路径无原生 import，
#   在无 .node 的树里 import 成功、引擎干净启动（实测 0 pending）。真正的隔离只在
#   confine() 被调用时 fail-closed，而默认 preset 是 danger-full-access，实际不会走到。
#   bash 不受影响：dsh-bash-local 只 inject subprocess，从不调用 ctx.sandbox。
#
# v1.12：llm-pi-ai 取消禁用（旧版本误当它依赖原生模块）。
# 0.1.5 树里 @earendil-works/pi-ai 纯 JS：5.7MB，openai / @anthropic-ai/sdk / @google/genai /
# typebox 等依赖齐全，树内原生模块 0，实测可正常加载。
# 它一旦被禁：设置 → 模型 取不到协议列表 →「添加提供方」永远置灰，
# 且「自定义供应商」入口压根不渲染（见 CHANGES.md v1.12）。
- id: bash-sandbox
  disabled: true
# rc.2 新增：PowerShell 沙箱（Android 无 pwsh，禁用）。
# 注意：树里该插件的条目 id 是 pwsh-sandbox（不是 dsh-pwsh-sandbox）——
# v1.6.5 起 id 不匹配导致禁用不生效，引擎启动时 pwsh-sandbox 会去等 sandbox 服务
# → pending → 启动失败、node 反复崩溃。v1.7.1 修正 id。
- id: pwsh-sandbox
  disabled: true
# 会话日志导出按钮（右上角 session log，下载 ZIP）：移动端用不上，禁用留出空间
- id: session-log-download
  disabled: true
# 遥测（OTel）：Android 端不需要上报，且它是 0.1.5 树里最大的依赖块（@opentelemetry 全套）。
# 禁用后可以整个删掉遥测包，显著减小 payload。
- id: session-telemetry-otel
  disabled: true
# ⚠ 关于 0.1.5 新增包（dsh-webhook / dsh-webhook-github / dsh-http-proxy / dsh-acp-app /
# dsh-sdk-app / dsh-sdk-minimal / dsh-hooks-claude-code / dsh-hooks-codex）：
# 这些包虽然存在于内核树里，但 **未被 @deepseek-ai/dsh-base 或 dsh-web-app 的插件表注册**，
# 因此引擎根本不会加载它们，无需（也无法）用 disabled 条目禁用。
# 早期版本曾按包名去 dsh- 前缀猜测 id 写了 8 条禁用，全部是空操作，0.1.5 升级时已删除，
# 以免留下“以为禁用了”的假象。此处保留记录，供后续核对。
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        # AI 工作区（可选）：MainActivity 选择外部共享存储目录后通过 DSH_WORKSPACE 环境变量传入；
        # 未设置时回退引擎进程目录。这样 bash/文件操作的工作根目录 = 用户选的文件夹。
        cwd: !!js (process.env.DSH_WORKSPACE || process.cwd())
        timeoutMs: 60000
    - id: tool-shizuku
      name: '@deepseek-ai/dsh-tool-shizuku'
    - id: tool-android
      name: '@deepseek-ai/dsh-tool-android'
    # v1.7：无障碍屏幕助手（读屏/点击/输入/滚动/截图，需用户在系统设置开启无障碍服务）
    - id: tool-accessibility
      name: '@deepseek-ai/dsh-tool-accessibility'
    # v1.8：虚拟屏幕（独立屏操作 App + 截图理解，需 root/Shizuku 特权 + 无障碍服务）
    - id: tool-vscreen
      name: '@deepseek-ai/dsh-tool-vscreen'
